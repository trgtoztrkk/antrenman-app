<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Antrenman">
<meta name="theme-color" content="#F2F2F7">
<title>Antrenman</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #F2F2F7;
    --surface: #FFFFFF;
    --surface-2: #E5E5EA;
    --surface-3: #D1D1D6;
    --separator: rgba(60, 60, 67, 0.12);
    --separator-strong: rgba(60, 60, 67, 0.24);
    --text: #000000;
    --text-2: #3C3C43;
    --text-3: #8E8E93;
    --accent: #007AFF;
    --accent-soft: rgba(0, 122, 255, 0.12);
    --success: #34C759;
    --success-soft: rgba(52, 199, 89, 0.12);
    --warning: #FF9500;
    --danger: #FF3B30;
    --focus: #FFCC00;
    --focus-soft: rgba(255, 204, 0, 0.15);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --radius-lg: 16px;
    --radius-md: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  [data-theme="dark"] {
    --bg: #000000;
    --surface: #1C1C1E;
    --surface-2: #2C2C2E;
    --surface-3: #3A3A3C;
    --separator: rgba(255, 255, 255, 0.09);
    --separator-strong: rgba(255, 255, 255, 0.18);
    --text: #FFFFFF;
    --text-2: #EBEBF5;
    --text-3: #8E8E93;
    --accent: #0A84FF;
    --accent-soft: rgba(10, 132, 255, 0.18);
    --success: #30D158;
    --success-soft: rgba(48, 209, 88, 0.18);
    --warning: #FF9F0A;
    --danger: #FF453A;
    --focus: #FFD60A;
    --focus-soft: rgba(255, 214, 10, 0.18);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    overscroll-behavior-y: none;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  button, input, select, textarea { font-family: inherit; }
  button { cursor: pointer; -webkit-appearance: none; appearance: none; }

  /* AUTH & ONBOARDING SCREEN */
  .onboard {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    overflow-y: auto;
  }
  .onboard.show { display: flex; animation: fadeIn 0.35s ease; }
  .onboard-card { width: 100%; max-width: 370px; }
  .onboard-logo {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.25rem;
    box-shadow: 0 8px 20px -6px rgba(0, 122, 255, 0.45);
  }
  .onboard-logo svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .onboard-card h1 {
    margin: 0 0 0.4rem;
    font-size: 1.5rem;
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.03em;
  }
  .onboard-card > p {
    margin: 0 0 1.5rem;
    font-size: 0.88rem;
    color: var(--text-3);
    line-height: 1.5;
    text-align: center;
  }
  .auth-tabs {
    display: flex;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 2px;
    margin-bottom: 1.25rem;
  }
  .auth-tabs button {
    flex: 1;
    padding: 0.5rem;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 0.82rem;
    font-weight: 500;
  }
  .auth-tabs button.active {
    background: var(--surface);
    color: var(--text);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }
  .field { margin-bottom: 0.75rem; }
  .field label {
    display: block;
    font-size: 0.72rem;
    color: var(--text-3);
    font-weight: 500;
    margin-bottom: 0.35rem;
    padding-left: 0.15rem;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 0.82rem 0.95rem;
    border-radius: var(--radius-md);
    border: 1px solid var(--separator);
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .field-hint {
    font-size: 0.72rem;
    color: var(--text-3);
    margin-top: 0.35rem;
    padding-left: 0.15rem;
    line-height: 1.4;
  }
  .btn-primary {
    width: 100%;
    padding: 0.9rem;
    border-radius: var(--radius-md);
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 0.96rem;
    font-weight: 600;
    margin-top: 0.75rem;
  }
  .btn-primary:active { opacity: 0.85; transform: scale(0.99); }
  .btn-primary:disabled { opacity: 0.5; }

  /* HEADER */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 20;
    padding: calc(var(--safe-top) + 0.75rem) 1rem 0.75rem;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid var(--separator);
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    max-width: 600px;
    margin: 0 auto;
  }
  .header-info { flex: 1; min-width: 0; }
  .header-name {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 0.45rem;
  }
  .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--success);
    display: inline-block;
    flex: 0 0 auto;
  }
  .sync-dot.syncing { background: var(--warning); animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .header-sub {
    font-size: 0.78rem;
    color: var(--text-3);
    margin-top: 0.1rem;
    font-weight: 400;
  }
  .header-actions { display: flex; gap: 0.25rem; align-items: center; flex: 0 0 auto; }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .icon-btn:active { background: var(--accent-soft); transform: scale(0.92); }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* SEGMENTED TABS */
  .segmented-wrap { padding: 0.75rem 1rem 1rem; max-width: 600px; margin: 0 auto; }
  .segmented {
    display: flex;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 2px;
    gap: 2px;
  }
  .segmented button {
    flex: 1;
    padding: 0.5rem 0.25rem;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 0.74rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .segmented button.active {
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }

  .view { display: none; padding: 0 1rem 5.5rem; max-width: 600px; margin: 0 auto; }
  .view.active { display: block; animation: fadeUp 0.3s cubic-bezier(0.25, 0.1, 0.25, 1); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  /* DATE NAV */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.35rem 0.25rem 1rem;
    gap: 0.5rem;
  }
  .date-arrow {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--separator);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .date-arrow:active { background: var(--surface-2); transform: scale(0.92); }
  .date-arrow svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .date-center { flex: 1; text-align: center; min-width: 0; }
  .date-main { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .date-sub { font-size: 0.75rem; color: var(--text-3); margin-top: 0.1rem; }
  .date-sub .today-action { color: var(--accent); font-weight: 500; cursor: pointer; }

  /* SESSION TIMER & REST TIMER */
  .session-block { margin-bottom: 0.85rem; }
  .btn-session {
    width: 100%;
    padding: 0.88rem;
    border-radius: var(--radius-md);
    border: none;
    font-size: 0.94rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  .btn-session:active { transform: scale(0.99); opacity: 0.9; }
  .btn-session.start { background: var(--accent); color: #fff; }
  .btn-session.end { background: var(--surface); color: var(--danger); border: 1px solid var(--separator); }
  .btn-session svg { width: 16px; height: 16px; fill: currentColor; }
  .btn-session.end svg { fill: none; stroke: currentColor; stroke-width: 2; }
  .session-running { display: flex; gap: 0.5rem; }
  .timer-display {
    flex: 0 0 auto;
    min-width: 100px;
    padding: 0.88rem 1rem;
    border-radius: var(--radius-md);
    background: var(--surface);
    border: 1px solid var(--separator);
    font-size: 0.95rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .session-done {
    padding: 0.88rem 1rem;
    border-radius: var(--radius-md);
    background: var(--success-soft);
    color: var(--success);
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .meta-row { display: flex; gap: 0.5rem; margin-bottom: 1.15rem; }
  .meta-tile {
    flex: 1;
    padding: 0.72rem 0.9rem;
    background: var(--surface);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    gap: 0.45rem;
    border: 1px solid var(--separator);
  }
  .meta-tile svg { width: 16px; height: 16px; stroke: var(--text-3); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  .meta-tile label { font-size: 0.78rem; color: var(--text-3); font-weight: 500; }
  .meta-tile input {
    flex: 1; min-width: 0;
    background: transparent; border: none;
    color: var(--text); font-size: 0.95rem; font-weight: 600;
    text-align: right; padding: 0;
    font-variant-numeric: tabular-nums;
  }
  .meta-tile input:focus { outline: none; }
  .meta-tile .unit { font-size: 0.75rem; color: var(--text-3); font-weight: 500; }

  .rest-pill-btn {
    padding: 0.72rem 0.95rem;
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 1px solid var(--separator);
    color: var(--accent);
    font-size: 0.82rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .rest-pill-btn:active { background: var(--surface-2); }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 0.25rem 0.5rem;
  }
  .section-title {
    font-size: 0.75rem;
    color: var(--text-3);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .section-count { font-size: 0.8rem; color: var(--text-3); font-weight: 500; font-variant-numeric: tabular-nums; }
  .section-count.done { color: var(--success); font-weight: 600; }

  .focus-card {
    display: flex;
    gap: 0.6rem;
    align-items: flex-start;
    padding: 0.75rem 1rem;
    background: var(--focus-soft);
    border-radius: var(--radius-md);
    margin-bottom: 1rem;
    font-size: 0.82rem;
    line-height: 1.45;
    color: var(--text-2);
  }
  .focus-card .star { flex: 0 0 auto; color: var(--focus); font-size: 1rem; line-height: 1.2; margin-top: 0.05rem; }
  .focus-card strong { color: var(--text); font-weight: 600; display: block; margin-bottom: 0.15rem; font-size: 0.82rem; }

  .ex-list {
    background: var(--surface);
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--separator);
  }
  .ex-row {
    padding: 0.95rem 1rem 0.9rem;
    border-bottom: 0.5px solid var(--separator);
    position: relative;
    user-select: none;
    -webkit-user-select: none;
  }
  .ex-row:last-child { border-bottom: none; }
  .ex-row.focus::before {
    content: '';
    position: absolute;
    left: 0; top: 12px; bottom: 12px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--focus);
  }
  .ex-row.focus.done::before { background: var(--success); }

  .ex-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.65rem;
  }
  .ex-name {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    display: flex;
    align-items: center;
    gap: 0.45rem;
    flex-wrap: wrap;
  }
  .ex-row.done .ex-name { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-3); }
  .focus-pill {
    display: inline-flex;
    align-items: center;
    padding: 0.12rem 0.45rem;
    border-radius: 100px;
    background: var(--focus-soft);
    color: var(--text);
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .group-tag {
    font-size: 0.65rem;
    font-weight: 600;
    padding: 0.1rem 0.42rem;
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--text-3);
  }
  .ex-reps { font-size: 0.82rem; color: var(--text-3); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; flex: 0 0 auto; }

  .sets-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .sets { display: flex; gap: 0.42rem; flex-wrap: wrap; }
  .set {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--separator-strong);
    background: transparent;
    color: var(--text-3);
    font-size: 0.7rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    transition: all 0.2s cubic-bezier(0.34, 1.3, 0.64, 1);
  }
  .set:active { transform: scale(0.9); }
  .set.done { background: var(--accent); border-color: var(--accent); color: #fff; transform: scale(1.02); }
  .ex-row.done .set.done { background: var(--success); border-color: var(--success); }

  .weight-btn {
    flex: 0 0 auto;
    padding: 0.4rem 0.75rem;
    border-radius: 100px;
    background: var(--surface-2);
    color: var(--text-3);
    border: none;
    font-size: 0.75rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    display: flex; align-items: center; gap: 0.25rem;
  }
  .weight-btn:active { transform: scale(0.94); }
  .weight-btn.has-weight { background: var(--accent-soft); color: var(--accent); }

  .rest-card {
    padding: 2.75rem 1.5rem;
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--separator);
    text-align: center;
    margin-top: 0.5rem;
  }
  .rest-card .moon { font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.7; }
  .rest-card h3 { margin: 0 0 0.35rem; font-size: 1rem; font-weight: 600; }
  .rest-card p { margin: 0; font-size: 0.85rem; color: var(--text-3); line-height: 1.5; }

  .notes-section { margin-top: 1.35rem; }
  .notes-section > h3 {
    font-size: 0.75rem; color: var(--text-3); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 0.5rem 0.25rem;
  }
  .notes-list {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--separator);
    padding: 0.9rem 1rem;
    font-size: 0.82rem;
    color: var(--text-2);
    line-height: 1.55;
  }
  .notes-list ul { margin: 0; padding-left: 1.1rem; }
  .notes-list li { margin-bottom: 0.25rem; }
  .notes-list li:last-child { margin-bottom: 0; }

  /* PROGRAM EDITOR VIEW */
  .day-pills {
    display: flex;
    gap: 0.35rem;
    overflow-x: auto;
    padding-bottom: 0.75rem;
    margin-bottom: 0.5rem;
    scrollbar-width: none;
  }
  .day-pills::-webkit-scrollbar { display: none; }
  .day-pill {
    padding: 0.5rem 0.85rem;
    border-radius: 100px;
    border: 1px solid var(--separator);
    background: var(--surface);
    color: var(--text-2);
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .day-pill.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .prog-ex-card {
    background: var(--surface);
    border: 1px solid var(--separator);
    border-radius: var(--radius-md);
    padding: 0.85rem 1rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }
  .prog-ex-info { flex: 1; min-width: 0; }
  .prog-ex-title { font-size: 0.94rem; font-weight: 600; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .prog-ex-meta { font-size: 0.78rem; color: var(--text-3); margin-top: 0.2rem; }
  .prog-ex-actions { display: flex; gap: 0.3rem; flex: 0 0 auto; }
  .mini-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--separator);
    background: var(--bg);
    color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .mini-btn.danger { color: var(--danger); }
  .mini-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }

  /* STATS & CALENDAR & SETTINGS */
  .stats-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--separator);
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .stats-card > h3 {
    font-size: 0.72rem; color: var(--text-3); text-transform: uppercase;
    letter-spacing: 0.06em; font-weight: 500; margin: 0 0 0.75rem;
  }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .stat-tile { background: var(--surface-2); border-radius: var(--radius-md); padding: 0.75rem 0.85rem; display: flex; flex-direction: column; gap: 0.15rem; }
  .stat-value { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--text); line-height: 1.1; }
  .stat-label { font-size: 0.72rem; color: var(--text-3); font-weight: 500; }

  .donut-wrap { display: flex; align-items: center; gap: 1rem; }
  .donut { width: 116px; height: 116px; flex: 0 0 auto; }
  .donut-legend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.4rem; }
  .donut-legend-item { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-size: 0.78rem; }
  .donut-legend-label { display: flex; align-items: center; gap: 0.4rem; color: var(--text-2); font-weight: 500; }
  .donut-legend-dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  .donut-legend-value { color: var(--text-3); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 0.72rem; white-space: nowrap; }
  .stats-empty { text-align: center; color: var(--text-3); font-size: 0.82rem; padding: 1.5rem 0; }

  .card-cta {

  .settings-row:last-child { border-bottom: none; }

  .info-row .value.fire { color: var(--warning); font-weight: 600; }

  /* MODALS & SHEETS */
  .sheet-modal {

    background: rgba(0, 0, 0, 0.5);

  }
  .sheet-head h3 { margin: 0; font-size: 1.05rem; font-weight: 700; }

  .card-date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.4rem; }

  // YARDIMCI TARİH & FORMAT FONKSİYONLARI
  function toISO(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function fromISO(s) {
    var p = s.split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function normalizeToMonday(d) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = t.getDay();
    t.setDate(t.getDate() - (day === 0 ? 6 : day - 1));
    return t;
  }
  function daysBetween(a, b) { return Math.round((b.getTime() - a.getTime()) / 86400000); }
  function today() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function formatDateTR(d) { return DAYS_TR[d.getDay()] + ", " + d.getDate() + " " + MONTHS_TR[d.getMonth()]; }
  function formatDuration(sec) {
    if (!sec && sec !== 0) return "--:--";
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return h > 0 ? h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") : m + ":" + String(s).padStart(2, "0");
  }
  function formatDurationLong(sec) {
    if (!sec) return "0 dk";
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    return h > 0 ? h + "s " + m + "dk" : m + " dk";
  }
  function formatWeight(w) { return w == null ? null : (w === Math.floor(w) ? String(w) : w.toFixed(1).replace(/\.0$/, "")); }
  function formatVolume(kg) { return kg <= 0 ? "0" : (kg < 1000 ? Math.round(kg) + " kg" : (kg / 1000).toFixed(1).replace(".0", "") + " t"); }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  var toastTimer = null;

  // BULUT SENKRONİZASYONU (SUPABASE)
  function saveToCloud() {
    if (!currentUser) return;
    var dot = $("#syncDot");
    if (dot) dot.classList.add("syncing");
    clearTimeout(saveDebounceTimer);
    saveDebounceTimer = setTimeout(async function () {
      var payload = {
        user_id: currentUser.id,
        display_name: state.name,
        start_date: state.startDate,
        program: state.program,
        general_notes: state.generalNotes,
        sessions: state.sessions,
        updated_at: new Date().toISOString()
      };
      var { error } = await sb.from("user_fitness_data").upsert(payload);
      if (dot) dot.classList.remove("syncing");
      if (error) showToast("Senkronizasyon hatası: " + error.message);
    }, 400);
  }

  async function loadFromCloud() {
    if (!currentUser) return;
    var { data, error } = await sb.from("user_fitness_data").select("*").eq("user_id", currentUser.id).maybeSingle();
    if (data) {
      state.name = data.display_name || currentUser.email.split("@")[0];
      state.startDate = data.start_date || toISO(normalizeToMonday(today()));
      state.program = (data.program && Object.keys(data.program).length) ? data.program : JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
      state.generalNotes = Array.isArray(data.general_notes) ? data.general_notes : DEFAULT_NOTES.slice();
      state.sessions = data.sessions || {};

      // İlk kez giriş yapan kullanıcıya başlangıç profili oluştur

      state.name = regName || currentUser.email.split("@")[0];
      state.startDate = toISO(normalizeToMonday(today()));
      state.program = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
      state.generalNotes = DEFAULT_NOTES.slice();
      state.sessions = {};

    }
    renderAll();
  }

  // PROGRAM & OTURUM HESAPLAMALARI
  function getDayKeyForDate(date) {
    if (!state.startDate) return "Pazartesi";
    var diff = daysBetween(fromISO(state.startDate), date);
    var idx = ((diff % 7) + 7) % 7;
    return WEEK_DAYS[idx];
  }
  function getMuscleGroup(exObj) {
    if (exObj.group) return exObj.group;
    var n = exObj.name.toLowerCase();
    if (n.indexOf("bench") >= 0 || n.indexOf("ohp") >= 0 || n.indexOf("raise") >= 0 || n.indexOf("şınav") >= 0) return "İtme";
    if (n.indexOf("row") >= 0 || n.indexOf("pull") >= 0 || n.indexOf("barfiks") >= 0 || n.indexOf("curl") >= 0) return "Çekme";
    if (n.indexOf("squat") >= 0 || n.indexOf("rdl") >= 0 || n.indexOf("hip") >= 0 || n.indexOf("swing") >= 0 || n.indexOf("leg") >= 0) return "Bacak";
    if (n.indexOf("plank") >= 0 || n.indexOf("crunch") >= 0 || n.indexOf("twist") >= 0 || n.indexOf("chop") >= 0 || n.indexOf("halo") >= 0) return "Core";
    return "Kondisyon";
  }

  function getSession(dateISO) { return state.sessions[dateISO] || {}; }
  function ensureSession(dateISO) {
    if (!state.sessions[dateISO]) state.sessions[dateISO] = { sets: {}, weights: {} };
    if (!state.sessions[dateISO].sets) state.sessions[dateISO].sets = {};
    if (!state.sessions[dateISO].weights) state.sessions[dateISO].weights = {};
    return state.sessions[dateISO];
  }
  function pushUndo() {
    undoStack.push(JSON.stringify(state.sessions));
    if (undoStack.length > 20) undoStack.shift();
  }
  function toggleSet(dateISO, exName, setIdx, totalSets) {
    pushUndo();
    var s = ensureSession(dateISO);
    if (!s.sets[exName]) s.sets[exName] = new Array(totalSets).fill(false);
    s.sets[exName][setIdx] = !s.sets[exName][setIdx];
    if (s.sets[exName].every(function (v) { return !v; })) delete s.sets[exName];
    saveToCloud();
  }
  function markAllSets(dateISO, exName, totalSets, value) {
    pushUndo();
    var s = ensureSession(dateISO);
    s.sets[exName] = new Array(totalSets).fill(!!value);
    if (!value) delete s.sets[exName];
    saveToCloud();
  }
  function setExerciseWeight(dateISO, exName, value) {
    pushUndo();
    var s = ensureSession(dateISO);
    if (value == null) delete s.weights[exName];
    else s.weights[exName] = value;
    saveToCloud();
  }

  function getDayProgress(dateISO, dayKey) {
    var prog = state.program[dayKey];
    if (!prog || prog.rest || !prog.ex) return { total: 0, done: 0 };
    var total = 0, done = 0;
    prog.ex.forEach(function (ex) {
      total += ex.sets;
      var arr = (getSession(dateISO).sets && getSession(dateISO).sets[ex.name]) || [];
      for (var i = 0; i < ex.sets; i++) if (arr[i]) done++;
    });
    return { total: total, done: done };
  }

  function calculateStreak() {
    if (!state.startDate) return 0;
    var t = today(), start = fromISO(state.startDate), d = new Date(t);
    var todayKey = getDayKeyForDate(t), todayProg = state.program[todayKey];
    var todayISO = toISO(t), startFromToday = false;
    if (!todayProg || todayProg.rest) startFromToday = true;
    else {
      var s = state.sessions[todayISO];
      if (s && s.sets) for (var k in s.sets) if (s.sets[k] && s.sets[k].some(Boolean)) { startFromToday = true; break; }
    }
    if (!startFromToday) d.setDate(d.getDate() - 1);
    var streak = 0, guard = 0;
    while (guard++ < 365 && d.getTime() >= start.getTime()) {
      var iso = toISO(d), dk = getDayKeyForDate(d), dp = state.program[dk];
      if (!dp || dp.rest) streak++;
      else {
        var ss = state.sessions[iso], hasAny = false;
        if (ss && ss.sets) for (var k2 in ss.sets) if (ss.sets[k2] && ss.sets[k2].some(Boolean)) { hasAny = true; break; }
        if (hasAny) streak++; else break;
      }
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  // 1. ANTRENMAN EKRANI RENDER
  function renderWorkout() {
    var dateISO = toISO(selectedDate);
    var dayKey = getDayKeyForDate(selectedDate);
    var prog = state.program[dayKey] || { rest: true, ex: [] };

    $("#dateMain").textContent = formatDateTR(selectedDate);
    var diff = daysBetween(today(), selectedDate);
    var rel = diff === 0 ? "Bugün" : (diff === -1 ? "Dün" : (diff === 1 ? "Yarın" : (diff < 0 ? Math.abs(diff) + " gün önce" : diff + " gün sonra")));
    var subText = (!prog.rest ? dayKey + " · " : "") + rel;
    if (dateISO !== toISO(today())) subText += ' · <span class="today-action" id="goToday">Bugüne dön</span>';
    $("#dateSub").innerHTML = subText;
    var gt = $("#goToday");
    if (gt) gt.addEventListener("click", function () { selectedDate = today(); renderWorkout(); });

    if (prog.rest || !prog.ex || prog.ex.length === 0) {
      $("#workoutContent").innerHTML = '<div class="rest-card"><div class="moon">🌙</div><h3>' + (prog.rest ? 'Dinlenme Günü' : 'Hareket Eklenmemiş') + '</h3><p>' + (prog.rest ? 'Bugün antrenman yok. İyi dinlen!' : 'Bu gün için henüz hareket yok. "Programım" sekmesinden ekleyebilirsin.') + '</p></div>';
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      return;
    }

    var session = getSession(dateISO);
    var pStats = getDayProgress(dateISO, dayKey);
    var isRunning = !!(session.startedAt && !session.endedAt);
    var duration = isRunning ? Math.floor((Date.now() - session.startedAt) / 1000) : (session.duration || 0);

    var html = '<div class="session-block">';
    if (!session.startedAt) {
      html += '<button class="btn-session start" id="startSessionBtn"><svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20"/></svg>Antrenmanı Başlat</button>';
    } else if (isRunning) {
      html += '<div class="session-running"><div class="timer-display" id="liveTimer">' + formatDuration(duration) + '</div><button class="btn-session end" id="endSessionBtn"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg>Bitir</button></div>';
    } else {
      html += '<div class="session-done">✓ ' + formatDuration(duration) + ' tamamlandı</div>';
    }
    html += '</div>';

    // Kalori + Set Arası Dinlenme Sayacı Butonu
    html += '<div class="meta-row"><div class="meta-tile">';
    html += '<svg viewBox="0 0 24 24"><path d="M12 2s4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 1-3s1 2 3 2c0 0-2-4 0-7z"/></svg>';
    html += '<label>Kalori</label><input type="number" id="calorieInput" inputmode="numeric" value="' + (session.calories || "") + '" placeholder="0"><span class="unit">kcal</span>';
    html += '</div><button class="rest-pill-btn" onclick="openRestModal()">⏱ <span id="restPillLabel">Sayaç</span></button></div>';

    if (prog.focus && prog.focusNote) {
      html += '<div class="focus-card"><span class="star">★</span><div><strong>Odak · ' + escapeHtml(prog.focus) + '</strong>' + escapeHtml(prog.focusNote) + '</div></div>';
    }

    html += '<div class="section-head"><span class="section-title">' + dayKey + ' Programı</span><span class="section-count' + (pStats.done === pStats.total ? ' done' : '') + '">' + pStats.done + ' / ' + pStats.total + '</span></div>';

    html += '<div class="ex-list">';
    prog.ex.forEach(function (ex) {
      var sets = (session.sets && session.sets[ex.name]) || [];
      var doneCount = sets.filter(Boolean).length;
      var exDone = doneCount === ex.sets;
      var isFocus = prog.focus === ex.name;
      var w = (session.weights && session.weights[ex.name] != null) ? session.weights[ex.name] : null;

      html += '<div class="ex-row' + (exDone ? ' done' : '') + (isFocus ? ' focus' : '') + '" data-ex="' + escapeHtml(ex.name) + '">';
      html += '<div class="ex-top"><div class="ex-name">' + escapeHtml(ex.name);
      if (isFocus) html += '<span class="focus-pill">★ Odak</span>';
      html += '</div><div class="ex-reps">' + ex.sets + ' × ' + escapeHtml(ex.reps) + '</div></div>';
      html += '<div class="sets-row"><div class="sets">';
      for (var k = 0; k < ex.sets; k++) {
        html += '<button class="set' + (sets[k] ? ' done' : '') + '" data-set="' + k + '">' + (k + 1) + '</button>';
      }
      html += '</div><button class="weight-btn' + (w != null ? ' has-weight' : '') + '" data-weight-btn="1">' + (w != null ? formatWeight(w) + ' kg' : '+ kg') + '</button></div></div>';
    });
    html += '</div>';

    if (prog.notes) {
      prog.notes.forEach(function (n) {
        html += '<div class="notes-section"><h3>' + escapeHtml(n.title) + '</h3><div class="notes-list"><ul>';
        n.items.forEach(function (x) { html += '<li>' + escapeHtml(x) + '</li>'; });
        html += '</ul></div></div>';
      });
    }

    if (state.generalNotes && state.generalNotes.length) {
      html += '<div class="notes-section"><h3>Genel Notlar</h3><div class="notes-list"><ul>';
      state.generalNotes.forEach(function (x) { html += '<li>' + escapeHtml(x) + '</li>'; });
      html += '</ul></div></div>';
    }

    $("#workoutContent").innerHTML = html;

    // Eventler
    var sBtn = $("#startSessionBtn");
    if (sBtn) sBtn.addEventListener("click", function () {
      pushUndo();
      ensureSession(dateISO).startedAt = Date.now();
      saveToCloud();
      renderWorkout();
    });
    var eBtn = $("#endSessionBtn");
    if (eBtn) eBtn.addEventListener("click", function () {
      var s = ensureSession(dateISO);
      if (s.startedAt) { s.endedAt = Date.now(); s.duration = Math.round((s.endedAt - s.startedAt) / 1000); }
      saveToCloud();
      renderWorkout();
      showToast("Antrenman kaydedildi · " + formatDuration(s.duration));
    });
    var calInput = $("#calorieInput");
    if (calInput) calInput.addEventListener("input", function () {
      var v = parseInt(calInput.value, 10);
      ensureSession(dateISO).calories = isNaN(v) ? null : v;
      saveToCloud();
    });

    $("#workoutContent").querySelectorAll(".ex-row").forEach(function (exEl) {
      var exName = exEl.dataset.ex;

  // 4. İSTATİSTİK & PAYLAŞIM KARTI
  function parseAvgReps(repsStr) {
    if (!repsStr) return null;
    var s = String(repsStr).trim();
    var m = s.match(/^(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)$/);
    if (m) return (parseFloat(m[1]) + parseFloat(m[2])) / 2;
    m = s.match(/^(\d+)\s*\+\s*(\d+)$/);
    if (m) return parseInt(m[1], 10) + parseInt(m[2], 10);
    m = s.match(/^(\d+(?:\.\d+)?)$/);
    return m ? parseFloat(m[1]) : null;
  }

  function collectRangeStats(startISO, endISO) {
    var sessions = 0, setsCount = 0, duration = 0, calories = 0, volume = 0;
    var groups = {};
    GROUP_ORDER.forEach(function (g) { groups[g] = 0; });
    for (var iso in state.sessions) {
      if (iso < startISO || iso > endISO) continue;
      var s = state.sessions[iso];
      if (!s || !s.sets) continue;
      var dk = getDayKeyForDate(fromISO(iso)), prog = state.program[dk];
      if (!prog || prog.rest || !prog.ex) continue;
      var hasAny = false;
      prog.ex.forEach(function (ex) {
        var arr = s.sets[ex.name] || [];
        var doneCount = arr.filter(Boolean).length;
        if (doneCount > 0) {
          hasAny = true;
          setsCount += doneCount;
          var grp = getMuscleGroup(ex);
          if (groups[grp] !== undefined) groups[grp] += doneCount;
          var w = s.weights && s.weights[ex.name];
          if (w != null) {
            var reps = parseAvgReps(ex.reps);
            if (reps) volume += w * doneCount * reps;
          }
        }
      });
      if (hasAny) sessions++;
      duration += s.duration || 0;
      calories += s.calories || 0;
    }
    return { sessions: sessions, sets: setsCount, duration: duration, calories: calories, volume: volume, groups: groups };
  }

  function renderDonut(groups) {
    var total = 0;
    GROUP_ORDER.forEach(function (g) { total += (groups[g] || 0); });
    if (total === 0) return '<div class="stats-empty">Bu ay henüz veri yok</div>';
    var r = 70, sw = 26, circ = 2 * Math.PI * r, offset = 0;
    var svg = '<svg viewBox="0 0 200 200" class="donut"><circle cx="100" cy="100" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="' + sw + '"/>';
    GROUP_ORDER.forEach(function (g) {
      var count = groups[g] || 0;
      if (!count) return;
      var dash = (count / total) * circ;
      svg += '<circle cx="100" cy="100" r="' + r + '" fill="none" stroke="' + GROUP_COLORS[g] + '" stroke-width="' + sw + '" stroke-dasharray="' + dash + ' ' + (circ - dash) + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 100 100)"/>';
      offset += dash;
    });
    svg += '</svg><div class="donut-legend">';
    GROUP_ORDER.forEach(function (g) {
      var count = groups[g] || 0, pct = Math.round((count / total) * 100);
      svg += '<div class="donut-legend-item"><span class="donut-legend-label"><span class="donut-legend-dot" style="background:' + GROUP_COLORS[g] + '"></span>' + g + '</span><span class="donut-legend-value">' + count + ' · ' + pct + '%</span></div>';
    });
    return '<div class="donut-wrap">' + svg + '</div></div>';
  }

    var html = '<button class="card-cta" id="openCardBtn"><div class="card-cta-icon"><svg viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 0 1 2.828 0L16 16"/><path d="M14 14l1.586-1.586a2 2 0 0 1 2.828 0L20 14"/><circle cx="9" cy="9" r="2"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg></div><div class="card-cta-text"><div class="card-cta-title">Antrenman Kartı Oluştur</div><div class="card-cta-sub">Tarih aralığı seç, Story olarak paylaş</div></div><svg class="card-cta-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>';

  function roundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawCard(canvas, startISO, endISO) {
    var W = 1080, H = 1920;
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext("2d");
    var isDark = document.documentElement.getAttribute("data-theme") === "dark";
    var bgTop = isDark ? "#0F0F14" : "#FFFFFF", bgBottom = isDark ? "#000000" : "#F2F2F7";
    var text = isDark ? "#FFFFFF" : "#000000", text3 = "#8E8E93";
    var sep = isDark ? "rgba(255,255,255,0.10)" : "rgba(60,60,67,0.12)";
    var accent = isDark ? "#0A84FF" : "#007AFF", success = isDark ? "#30D158" : "#34C759";

    var bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, bgTop); bgGrad.addColorStop(1, bgBottom);
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

    var pad = 90, stats = collectRangeStats(startISO, endISO);
    ctx.fillStyle = accent; ctx.fillRect(pad, 90, 100, 8);
    ctx.fillStyle = text3; ctx.font = "700 24px -apple-system, sans-serif";
    ctx.fillText("ANTRENMAN ÖZETİ", pad, 170);

    var s = fromISO(startISO), e = fromISO(endISO);
    ctx.fillStyle = text; ctx.font = "800 72px -apple-system, sans-serif";
    ctx.fillText(s.getDate() + " " + MONTHS_TR[s.getMonth()] + " — " + e.getDate() + " " + MONTHS_TR[e.getMonth()], pad, 280);

    ctx.fillStyle = sep; ctx.fillRect(pad, 340, W - pad * 2, 2);

    var tiles = [
      { label: "ANTRENMAN", value: String(stats.sessions) },
      { label: "SET", value: String(stats.sets) },
      { label: "SÜRE", value: formatDurationLong(stats.duration) }
    ];
    if (stats.calories > 0) tiles.push({ label: "KALORİ", value: stats.calories + " kcal" });

    var colW = (W - pad * 2) / tiles.length;
    tiles.forEach(function (t, i) {
      var cx = pad + colW * i + colW / 2;
      ctx.textAlign = "center";
      ctx.fillStyle = text3; ctx.font = "700 20px -apple-system, sans-serif"; ctx.fillText(t.label, cx, 430);
      ctx.fillStyle = text; ctx.font = "800 54px -apple-system, sans-serif"; ctx.fillText(t.value, cx, 505);
    });

    ctx.textAlign = "left";
    ctx.fillStyle = sep; ctx.fillRect(pad, 570, W - pad * 2, 2);
    ctx.fillStyle = text3; ctx.font = "700 24px -apple-system, sans-serif"; ctx.fillText("KAS GRUBU DAĞILIMI", pad, 640);

    var gTotal = 0, maxG = 0;
    GROUP_ORDER.forEach(function (g) { var v = stats.groups[g] || 0; gTotal += v; if (v > maxG) maxG = v; });
    GROUP_ORDER.forEach(function (g, i) {
      var c = stats.groups[g] || 0, pct = gTotal > 0 ? Math.round((c / gTotal) * 100) : 0;
      var y = 700 + i * 70;
      ctx.fillStyle = GROUP_COLORS[g]; ctx.beginPath(); ctx.arc(pad + 10, y + 8, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = text; ctx.font = "600 28px -apple-system, sans-serif"; ctx.fillText(g, pad + 35, y + 18);
      var bx = pad + 240, bw = W - pad * 2 - 440;
      ctx.fillStyle = sep; roundedRect(ctx, bx, y, bw, 14, 7); ctx.fill();
      if (c > 0 && maxG > 0) {
        ctx.fillStyle = GROUP_COLORS[g]; roundedRect(ctx, bx, y, Math.max((c / maxG) * bw, 14), 14, 7); ctx.fill();
      }
      ctx.textAlign = "right"; ctx.fillStyle = text; ctx.font = "700 24px -apple-system, sans-serif";
      ctx.fillText(c + " · " + pct + "%", W - pad, y + 18); ctx.textAlign = "left";
    });

    var streak = calculateStreak();
    if (streak > 0) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#FF9500"; ctx.font = "800 36px -apple-system, sans-serif";
      ctx.fillText("🔥 " + streak + " GÜN STREAK", W / 2, 1480);
    }

    ctx.textAlign = "center";
    ctx.fillStyle = text; ctx.font = "800 52px -apple-system, sans-serif";
    ctx.fillText(state.name || "Antrenman", W / 2, H - 150);
    ctx.fillStyle = text3; ctx.font = "500 22px -apple-system, sans-serif";
    ctx.fillText("antrenman günlüğü", W / 2, H - 105);
  }

  // 5. AYARLAR RENDER
  function renderSettings() {
    var html = '<div class="settings-group-title">Profil & Hesap</div><div class="settings-group">';
    html += '<div class="settings-row"><div class="label-wrap"><span>İsim Soyisim</span></div><input type="text" id="settingsName" value="' + escapeHtml(state.name || "") + '"></div>';
    html += '<div class="settings-row"><div class="label-wrap"><span>Program Başlangıç Pazartesi</span></div><input type="date" id="settingsDate" value="' + (state.startDate || toISO(normalizeToMonday(today()))) + '"></div>';
    html += '<button class="settings-row primary" id="saveProfileBtn"><span>Değişiklikleri Kaydet</span><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>';
    html += '</div>';

    html += '<div class="settings-group-title">Program Şablonları & Yedek</div><div class="settings-group">';
    html += '<button class="settings-row primary" id="loadDefaultProgBtn"><div class="label-wrap"><span>Varsayılan Programı Yükle</span><span class="sub">5 günlük Full Body / Kondisyon şablonunu yükler</span></div><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>';
    html += '<button class="settings-row primary" id="backupBtn"><div class="label-wrap"><span>JSON Yedek İndir</span><span class="sub">Tüm verilerini cihazına kaydet</span></div><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>';
    html += '</div>';

    html += '<div class="settings-group-title">Oturum</div><div class="settings-group">';
    html += '<div class="info-row"><span>Hesap</span><span class="value">' + escapeHtml(currentUser ? currentUser.email : "") + '</span></div>';
    html += '<button class="settings-row danger" id="logoutBtn"><span>Çıkış Yap</span><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>';
    html += '</div>';

    $("#settingsContent").innerHTML = html;

    $("#saveProfileBtn").addEventListener("click", function () {
      var n = $("#settingsName").value.trim(), d = $("#settingsDate").value;
      if (!n || !d) { showToast("İsim ve tarih gerekli"); return; }
      state.name = n;
      state.startDate = toISO(normalizeToMonday(fromISO(d)));
      saveToCloud();
      renderHeader();
      showToast("Profil kaydedildi");
    });

    $("#loadDefaultProgBtn").addEventListener("click", function () {
      if (!confirm("Mevcut haftalık program şablonun varsayılan programla değiştirilecek. Onaylıyor musun?")) return;
      state.program = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
      saveToCloud();
      showToast("Varsayılan program yüklendi");
    });

    $("#backupBtn").addEventListener("click", function () {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "antrenman-yedek-" + toISO(today()) + ".json";
      a.click();
      showToast("Yedek indirildi");
    });

    $("#logoutBtn").addEventListener("click", async function () {
      await sb.auth.signOut();
      currentUser = null;
      $("#authScreen").classList.add("show");
    });
  }

  function checkCelebration(dateISO, dayKey) {
    var p = getDayProgress(dateISO, dayKey);
    if (p.total > 0 && p.done === p.total) {
      if (state.sessions[dateISO] && state.sessions[dateISO].__celebrated) return;
      ensureSession(dateISO).__celebrated = true;
      saveToCloud();
      var colors = ["#007AFF", "#34C759", "#FFCC00"];
      for (var i = 0; i < 30; i++) {
        var piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "%";
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = (Math.random() * 0.3) + "s";
        $("#celebration").appendChild(piece);
        setTimeout(function (el) { if (el.parentNode) el.parentNode.removeChild(el); }, 2500, piece);
      }
      showToast("🎉 " + dayKey + " tamamlandı!");
    }
  }

  function renderAll() {
    renderHeader();
    if (currentView === "workout") renderWorkout();
    if (currentView === "program") renderProgramEditor();
    if (currentView === "calendar") renderCalendar();
    if (currentView === "stats") renderStats();
    if (currentView === "settings") renderSettings();
  }

  // BAŞLANGIÇ OTURUM DİNLEYİCİSİ
  sb.auth.onAuthStateChange(function (_event, session) {
    if (session && session.user) {
      currentUser = session.user;
      $("#authScreen").classList.remove("show");
      loadFromCloud();
    } else {
      currentUser = null;
      $("#authScreen").classList.add("show");
    }
  });
})();
</script>
</body>
</html>
