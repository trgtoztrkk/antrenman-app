<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Antrenman">
<meta name="theme-color" content="#F2F2F7">
<title>Antrenman</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #F2F2F7;
    --surface: #FFFFFF;
    --surface-2: #E5E5EA;
    --surface-3: #D1D1D6;
    --separator: rgba(60, 60, 67, 0.12);
    --separator-strong: rgba(60, 60, 67, 0.24);
    --text: #000000;
    --text-2: #3C3C43;
    --text-3: #8E8E93;
    --accent: #007AFF;
    --accent-soft: rgba(0, 122, 255, 0.12);
    --success: #34C759;
    --success-soft: rgba(52, 199, 89, 0.12);
    --warning: #FF9500;
    --danger: #FF3B30;
    --focus: #FFCC00;
    --focus-soft: rgba(255, 204, 0, 0.15);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --radius-lg: 16px;
    --radius-md: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  [data-theme="dark"] {
    --bg: #000000;
    --surface: #1C1C1E;
    --surface-2: #2C2C2E;
    --surface-3: #3A3A3C;
    --separator: rgba(255, 255, 255, 0.09);
    --separator-strong: rgba(255, 255, 255, 0.18);
    --text: #FFFFFF;
    --text-2: #EBEBF5;
    --text-3: #8E8E93;
    --accent: #0A84FF;
    --accent-soft: rgba(10, 132, 255, 0.18);
    --success: #30D158;
    --success-soft: rgba(48, 209, 88, 0.18);
    --warning: #FF9F0A;
    --danger: #FF453A;
    --focus: #FFD60A;
    --focus-soft: rgba(255, 214, 10, 0.18);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    overscroll-behavior-y: none;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  button, input, select, textarea { font-family: inherit; }
  button { cursor: pointer; -webkit-appearance: none; appearance: none; }

  /* AUTH & ONBOARDING SCREEN */
  .onboard {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    overflow-y: auto;
  }
  .onboard.show { display: flex; animation: fadeIn 0.35s ease; }
  .onboard-card { width: 100%; max-width: 370px; }
  .onboard-logo {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.25rem;
    box-shadow: 0 8px 20px -6px rgba(0, 122, 255, 0.45);
  }
  .onboard-logo svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .onboard-card h1 {
    margin: 0 0 0.4rem;
    font-size: 1.5rem;
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.03em;
  }
  .onboard-card > p {
    margin: 0 0 1.5rem;
    font-size: 0.88rem;
    color: var(--text-3);
    line-height: 1.5;
    text-align: center;
  }
  .auth-tabs {
    display: flex;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 2px;
    margin-bottom: 1.25rem;
  }
  .auth-tabs button {
    flex: 1;
    padding: 0.5rem;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 0.82rem;
    font-weight: 500;
  }
  .auth-tabs button.active {
    background: var(--surface);
    color: var(--text);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }
  .field { margin-bottom: 0.75rem; }
  .field label {
    display: block;
    font-size: 0.72rem;
    color: var(--text-3);
    font-weight: 500;
    margin-bottom: 0.35rem;
    padding-left: 0.15rem;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 0.82rem 0.95rem;
    border-radius: var(--radius-md);
    border: 1px solid var(--separator);
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .field-hint {
    font-size: 0.72rem;
    color: var(--text-3);
    margin-top: 0.35rem;
    padding-left: 0.15rem;
    line-height: 1.4;
  }
  .btn-primary {
    width: 100%;
    padding: 0.9rem;
    border-radius: var(--radius-md);
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 0.96rem;
    font-weight: 600;
    margin-top: 0.75rem;
  }
  .btn-primary:active { opacity: 0.85; transform: scale(0.99); }
  .btn-primary:disabled { opacity: 0.5; }

  /* HEADER */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 20;
    padding: calc(var(--safe-top) + 0.75rem) 1rem 0.75rem;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid var(--separator);
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    max-width: 600px;
    margin: 0 auto;
  }
  .header-info { flex: 1; min-width: 0; }
  .header-name {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 0.45rem;
  }
  .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--success);
    display: inline-block;
    flex: 0 0 auto;
  }
  .sync-dot.syncing { background: var(--warning); animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .header-sub {
    font-size: 0.78rem;
    color: var(--text-3);
    margin-top: 0.1rem;
    font-weight: 400;
  }
  .header-actions { display: flex; gap: 0.25rem; align-items: center; flex: 0 0 auto; }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .icon-btn:active { background: var(--accent-soft); transform: scale(0.92); }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* SEGMENTED TABS */
  .segmented-wrap { padding: 0.75rem 1rem 1rem; max-width: 600px; margin: 0 auto; }
  .segmented {
    display: flex;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 2px;
    gap: 2px;
  }
  .segmented button {
    flex: 1;
    padding: 0.5rem 0.25rem;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 0.74rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .segmented button.active {
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }

  .view { display: none; padding: 0 1rem 5.5rem; max-width: 600px; margin: 0 auto; }
  .view.active { display: block; animation: fadeUp 0.3s cubic-bezier(0.25, 0.1, 0.25, 1); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  /* DATE NAV */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.35rem 0.25rem 1rem;
    gap: 0.5rem;
  }
  .date-arrow {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--separator);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .date-arrow:active { background: var(--surface-2); transform: scale(0.92); }
  .date-arrow svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .date-center { flex: 1; text-align: center; min-width: 0; }
  .date-main { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .date-sub { font-size: 0.75rem; color: var(--text-3); margin-top: 0.1rem; }
  .date-sub .today-action { color: var(--accent); font-weight: 500; cursor: pointer; }

  /* SESSION TIMER & REST TIMER */
  .session-block { margin-bottom: 0.85rem; }
  .btn-session {
    width: 100%;
    padding: 0.88rem;
    border-radius: var(--radius-md);
    border: none;
    font-size: 0.94rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  .btn-session:active { transform: scale(0.99); opacity: 0.9; }
  .btn-session.start { background: var(--accent); color: #fff; }
  .btn-session.end { background: var(--surface); color: var(--danger); border: 1px solid var(--separator); }
  .btn-session svg { width: 16px; height: 16px; fill: currentColor; }
  .btn-session.end svg { fill: none; stroke: currentColor; stroke-width: 2; }
  .session-running { display: flex; gap: 0.5rem; }
  .timer-display {
    flex: 0 0 auto;
    min-width: 100px;
    padding: 0.88rem 1rem;
    border-radius: var(--radius-md);
    background: var(--surface);
    border: 1px solid var(--separator);
    font-size: 0.95rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .session-done {
    padding: 0.88rem 1rem;
    border-radius: var(--radius-md);
    background: var(--success-soft);
    color: var(--success);
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .meta-row { display: flex; gap: 0.5rem; margin-bottom: 1.15rem; }
  .meta-tile {
    flex: 1;
    padding: 0.72rem 0.9rem;
    background: var(--surface);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    gap: 0.45rem;
    border: 1px solid var(--separator);
  }
  .meta-tile svg { width: 16px; height: 16px; stroke: var(--text-3); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  .meta-tile label { font-size: 0.78rem; color: var(--text-3); font-weight: 500; }
  .meta-tile input {
    flex: 1; min-width: 0;
    background: transparent; border: none;
    color: var(--text); font-size: 0.95rem; font-weight: 600;
    text-align: right; padding: 0;
    font-variant-numeric: tabular-nums;
  }
  .meta-tile input:focus { outline: none; }
  .meta-tile .unit { font-size: 0.75rem; color: var(--text-3); font-weight: 500; }

  .rest-pill-btn {
    padding: 0.72rem 0.95rem;
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 1px solid var(--separator);
    color: var(--accent);
    font-size: 0.82rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .rest-pill-btn:active { background: var(--surface-2); }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 0.25rem 0.5rem;
  }
  .section-title {
    font-size: 0.75rem;
    color: var(--text-3);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .section-count { font-size: 0.8rem; color: var(--text-3); font-weight: 500; font-variant-numeric: tabular-nums; }
  .section-count.done { color: var(--success); font-weight: 600; }

  .focus-card {
    display: flex;
    gap: 0.6rem;
    align-items: flex-start;
    padding: 0.75rem 1rem;
    background: var(--focus-soft);
    border-radius: var(--radius-md);
    margin-bottom: 1rem;
    font-size: 0.82rem;
    line-height: 1.45;
    color: var(--text-2);
  }
  .focus-card .star { flex: 0 0 auto; color: var(--focus); font-size: 1rem; line-height: 1.2; margin-top: 0.05rem; }
  .focus-card strong { color: var(--text); font-weight: 600; display: block; margin-bottom: 0.15rem; font-size: 0.82rem; }

  .ex-list {
    background: var(--surface);
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--separator);
  }
  .ex-row {
    padding: 0.95rem 1rem 0.9rem;
    border-bottom: 0.5px solid var(--separator);
    position: relative;
    user-select: none;
    -webkit-user-select: none;
  }
  .ex-row:last-child { border-bottom: none; }
  .ex-row.focus::before {
    content: '';
    position: absolute;
    left: 0; top: 12px; bottom: 12px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--focus);
  }
  .ex-row.focus.done::before { background: var(--success); }

  .ex-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.65rem;
  }
  .ex-name {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    display: flex;
    align-items: center;
    gap: 0.45rem;
    flex-wrap: wrap;
  }
  .ex-row.done .ex-name { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-3); }
  .focus-pill {
    display: inline-flex;
    align-items: center;
    padding: 0.12rem 0.45rem;
    border-radius: 100px;
    background: var(--focus-soft);
    color: var(--text);
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .group-tag {
    font-size: 0.65rem;
    font-weight: 600;
    padding: 0.1rem 0.42rem;
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--text-3);
  }
  .ex-reps { font-size: 0.82rem; color: var(--text-3); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; flex: 0 0 auto; }

  .sets-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .sets { display: flex; gap: 0.42rem; flex-wrap: wrap; }
  .set {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--separator-strong);
    background: transparent;
    color: var(--text-3);
    font-size: 0.7rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    transition: all 0.2s cubic-bezier(0.34, 1.3, 0.64, 1);
  }
  .set:active { transform: scale(0.9); }
  .set.done { background: var(--accent); border-color: var(--accent); color: #fff; transform: scale(1.02); }
  .ex-row.done .set.done { background: var(--success); border-color: var(--success); }

  .weight-btn {
    flex: 0 0 auto;
    padding: 0.4rem 0.75rem;
    border-radius: 100px;
    background: var(--surface-2);
    color: var(--text-3);
    border: none;
    font-size: 0.75rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    display: flex; align-items: center; gap: 0.25rem;
  }
  .weight-btn:active { transform: scale(0.94); }
  .weight-btn.has-weight { background: var(--accent-soft); color: var(--accent); }

  .rest-card {
    padding: 2.75rem 1.5rem;
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--separator);
    text-align: center;
    margin-top: 0.5rem;
  }
  .rest-card .moon { font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.7; }
  .rest-card h3 { margin: 0 0 0.35rem; font-size: 1rem; font-weight: 600; }
  .rest-card p { margin: 0; font-size: 0.85rem; color: var(--text-3); line-height: 1.5; }

  .notes-section { margin-top: 1.35rem; }
  .notes-section > h3 {
    font-size: 0.75rem; color: var(--text-3); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 0.5rem 0.25rem;
  }
  .notes-list {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--separator);
    padding: 0.9rem 1rem;
    font-size: 0.82rem;
    color: var(--text-2);
    line-height: 1.55;
  }
  .notes-list ul { margin: 0; padding-left: 1.1rem; }
  .notes-list li { margin-bottom: 0.25rem; }
  .notes-list li:last-child { margin-bottom: 0; }

  /* PROGRAM EDITOR VIEW */
  .day-pills {
    display: flex;
    gap: 0.35rem;
    overflow-x: auto;
    padding-bottom: 0.75rem;
    margin-bottom: 0.5rem;
    scrollbar-width: none;
  }
  .day-pills::-webkit-scrollbar { display: none; }
  .day-pill {
    padding: 0.5rem 0.85rem;
    border-radius: 100px;
    border: 1px solid var(--separator);
    background: var(--surface);
    color: var(--text-2);
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .day-pill.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .prog-ex-card {
    background: var(--surface);
    border: 1px solid var(--separator);
    border-radius: var(--radius-md);
    padding: 0.85rem 1rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }
  .prog-ex-info { flex: 1; min-width: 0; }
  .prog-ex-title { font-size: 0.94rem; font-weight: 600; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .prog-ex-meta { font-size: 0.78rem; color: var(--text-3); margin-top: 0.2rem; }
  .prog-ex-actions { display: flex; gap: 0.3rem; flex: 0 0 auto; }
  .mini-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--separator);
    background: var(--bg);
    color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .mini-btn.danger { color: var(--danger); }
  .mini-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }

  /* STATS & CALENDAR & SETTINGS */
  .stats-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--separator);
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .stats-card > h3 {
    font-size: 0.72rem; color: var(--text-3); text-transform: uppercase;
    letter-spacing: 0.06em; font-weight: 500; margin: 0 0 0.75rem;
  }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .stat-tile { background: var(--surface-2); border-radius: var(--radius-md); padding: 0.75rem 0.85rem; display: flex; flex-direction: column; gap: 0.15rem; }
  .stat-value { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--text); line-height: 1.1; }
  .stat-label { font-size: 0.72rem; color: var(--text-3); font-weight: 500; }

  .donut-wrap { display: flex; align-items: center; gap: 1rem; }
  .donut { width: 116px; height: 116px; flex: 0 0 auto; }
  .donut-legend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.4rem; }
  .donut-legend-item { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-size: 0.78rem; }
  .donut-legend-label { display: flex; align-items: center; gap: 0.4rem; color: var(--text-2); font-weight: 500; }
  .donut-legend-dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  .donut-legend-value { color: var(--text-3); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 0.72rem; white-space: nowrap; }
  .stats-empty { text-align: center; color: var(--text-3); font-size: 0.82rem; padding: 1.5rem 0; }

  .card-cta {
    display: flex; align-items: center; gap: 0.85rem; width: 100%; padding: 1rem 1.1rem;
    background: linear-gradient(135deg, var(--accent), #5856D6);
    color: #fff; border: none; border-radius: var(--radius-lg); margin-bottom: 1rem; text-align: left;
    box-shadow: 0 8px 20px -8px rgba(0, 122, 255, 0.5);
  }
  .card-cta-icon { width: 40px; height: 40px; border-radius: 12px; background: rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .card-cta-icon svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2; }
  .card-cta-text { flex: 1; min-width: 0; }
  .card-cta-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.15rem; }
  .card-cta-sub { font-size: 0.75rem; opacity: 0.85; }
  .card-cta-arrow { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2.5; opacity: 0.7; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.25rem 1rem; gap: 0.5rem; }
  .cal-month { flex: 1; text-align: center; font-size: 1rem; font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.25rem; background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--separator); padding: 0.75rem 0.6rem 1rem; }
  .cal-header { text-align: center; font-size: 0.68rem; font-weight: 500; color: var(--text-3); padding: 0.4rem 0; }
  .cal-cell { aspect-ratio: 1; border-radius: 8px; background: transparent; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.82rem; font-weight: 500; color: var(--text); position: relative; padding: 0; font-variant-numeric: tabular-nums; }
  .cal-cell.empty { pointer-events: none; }
  .cal-cell.future { color: var(--text-3); opacity: 0.35; pointer-events: none; }
  .cal-cell.today { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .cal-cell.complete { background: var(--success-soft); color: var(--success); font-weight: 600; }
  .cal-cell.partial { background: var(--surface-2); color: var(--text); }
  .cal-dot { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .cal-cell.complete .cal-dot { background: var(--success); }
  .cal-cell.partial .cal-dot { background: var(--warning); }

  .legend { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; padding: 0 0.5rem; font-size: 0.75rem; color: var(--text-3); }
  .legend-item { display: flex; align-items: center; gap: 0.4rem; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .legend-dot.complete { background: var(--success); }
  .legend-dot.partial { background: var(--warning); }
  .legend-dot.pending { background: var(--accent); }

  .settings-group { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--separator); overflow: hidden; margin-bottom: 1.25rem; }
  .settings-group-title { font-size: 0.72rem; color: var(--text-3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; padding: 0 0.25rem 0.5rem; }
  .settings-row {
    padding: 0.9rem 1rem; border-bottom: 0.5px solid var(--separator);

  .settings-row:last-child { border-bottom: none; }
  .settings-row:active { background: var(--surface-2); }
  .settings-row.danger { color: var(--danger); }
  .settings-row.primary { color: var(--accent); font-weight: 600; }
  .settings-row svg { width: 16px; height: 16px; stroke: var(--text-3); fill: none; stroke-width: 2; flex: 0 0 auto; }
  .settings-row .label-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.15rem; }
  .settings-row .sub { font-size: 0.75rem; color: var(--text-3); font-weight: 400; }
  .settings-row input[type="text"], .settings-row input[type="date"] {
    flex: 1; text-align: right; background: transparent; border: none; color: var(--text); font-size: 0.92rem; padding: 0;
  }
  .settings-row input:focus { outline: none; }
  .info-row { padding: 0.9rem 1rem; border-bottom: 0.5px solid var(--separator); display: flex; align-items: center; justify-content: space-between; font-size: 0.92rem; }
  .info-row:last-child { border-bottom: none; }
  .info-row .value { color: var(--text-3); font-weight: 500; font-variant-numeric: tabular-nums; }
  .info-row .value.strong { color: var(--text); font-weight: 600; }
  .info-row .value.fire { color: var(--warning); font-weight: 600; }

  /* MODALS & SHEETS */
  .sheet-modal {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 3500;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .sheet-modal.show { display: flex; animation: fadeIn 0.2s ease; }
  .sheet-box {
    width: 100%; max-width: 480px; max-height: 85vh;
    background: var(--bg);
    border-radius: 24px 24px 0 0;
    display: flex; flex-direction: column; overflow: hidden;
    animation: slideUp 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    padding-bottom: var(--safe-bottom);
  }
  .sheet-head {
    padding: 1rem 1.25rem 0.8rem;
    border-bottom: 0.5px solid var(--separator);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sheet-head h3 { margin: 0; font-size: 1.05rem; font-weight: 700; }
  .sheet-head p { margin: 0.15rem 0 0; font-size: 0.78rem; color: var(--text-3); }
  .sheet-body { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; -webkit-overflow-scrolling: touch; }
  .sheet-foot { padding: 0.75rem 1.1rem 1rem; border-top: 0.5px solid var(--separator); display: flex; gap: 0.5rem; }
  .sheet-foot button {
    flex: 1; padding: 0.85rem; border-radius: var(--radius-md); border: none; font-size: 0.92rem; font-weight: 600;
  }
  .btn-cancel { background: var(--surface-2); color: var(--text); }
  .btn-save { background: var(--accent); color: #fff; }

  .weight-list { flex: 1; overflow-y: auto; padding: 0.35rem 0; }
  .weight-option {
    width: 100%; padding: 0.9rem 1.25rem; background: transparent; border: none; color: var(--text);
    font-size: 1.02rem; font-weight: 500; font-variant-numeric: tabular-nums; text-align: left;
    display: flex; align-items: center; justify-content: space-between;
  }
  .weight-option:active { background: var(--surface-2); }
  .weight-option.selected { color: var(--accent); font-weight: 700; }
  .weight-option.selected::after { content: '✓'; font-size: 1.15rem; font-weight: 600; }
  .weight-option.empty-option { color: var(--text-3); font-size: 0.92rem; }

  .card-date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.4rem; }
  .card-preview-wrap { margin-top: 1rem; border-radius: 16px; overflow: hidden; background: var(--surface-2); box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
  .card-preview { display: block; width: 100%; height: auto; }
  .btn-action { flex: 1; padding: 0.85rem; border-radius: var(--radius-md); border: none; font-size: 0.92rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 0.45rem; }
  .btn-action.share { background: var(--accent); color: #fff; }
  .btn-action.download { background: var(--surface); color: var(--text); border: 1px solid var(--separator); }
  .btn-action svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

  .toast {
    position: fixed; bottom: calc(1.5rem + var(--safe-bottom)); left: 50%;
    transform: translateX(-50%) translateY(140%);
    background: var(--text); color: var(--bg);
    padding: 0.75rem 1.25rem; border-radius: 100px;
    font-size: 0.85rem; font-weight: 500;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    transition: transform 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
    z-index: 5000; pointer-events: none; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .celebration { position: fixed; inset: 0; pointer-events: none; z-index: 4999; overflow: hidden; }
  .confetti { position: absolute; width: 6px; height: 6px; border-radius: 50%; top: -10px; animation: confettiFall 1.6s cubic-bezier(0.3, 0.6, 0.6, 1) forwards; }
  @keyframes confettiFall { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(110vh); opacity: 0; } }
</style>
